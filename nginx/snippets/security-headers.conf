# Baseline headers for every response. Script/style CSP is left to each Next.js app (nonces).
add_header X-Request-ID              $platform_request_id always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-Frame-Options           "DENY" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy   "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
# Enable once served over TLS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
